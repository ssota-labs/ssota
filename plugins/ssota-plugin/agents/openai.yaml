interface:
  display_name: "SSOTA Plugin"
  short_description: "Use SSOTA MCP instructions and graph/task tools from Codex."
  brand_color: "#2563EB"
  default_prompt: "Use the ssota-mcp skill to discover workflow instructions, query project/task/graph state, and author graph nodes/edges/pages via the MCP write tools."

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "ssota"
      description: "SSOTA MCP server for instruction-driven automation and graph/task/page tools."
      transport: "streamable_http"
      url: "http://127.0.0.1:3001/api/mcp"
