interface:
  display_name: "LoopOS Plugin"
  short_description: "Use LoopOS MCP instructions and action contracts from Codex."
  brand_color: "#2563EB"
  default_prompt: "Use the loopos-mcp skill to discover instructions, inspect action contracts, execute LoopOS actions, and verify outcomes."

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "loopos"
      description: "LoopOS MCP server for instruction-driven automation and execute_action workflows."
      transport: "streamable_http"
      url: "http://127.0.0.1:3001/api/mcp"
