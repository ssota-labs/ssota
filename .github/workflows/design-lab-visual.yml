name: Design Lab Visual

on:
  pull_request:
    paths:
      - "packages/ui/**"
      - "apps/design-lab/**"
      - "e2e/design-lab/**"
      - "e2e/tests/design-lab-visual.spec.ts"
      - "e2e/playwright.design-lab.config.ts"
      - ".github/workflows/design-lab-visual.yml"
  push:
    branches: [main]
    paths:
      - "packages/ui/**"
      - "apps/design-lab/**"
      - "e2e/design-lab/**"
      - "e2e/tests/design-lab-visual.spec.ts"
      - "e2e/playwright.design-lab.config.ts"

jobs:
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Design Lab
        run: pnpm design-lab:build

      - name: Install Playwright Chromium
        run: pnpm --filter e2e exec playwright install chromium

      - name: Run Design Lab visual tests
        run: pnpm e2e:design-lab
