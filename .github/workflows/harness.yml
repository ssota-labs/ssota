name: Harness

# 하네스 게이트 — 계약(packages/contracts/src/invariants/rules.ts)과 문서·코드·PR의
# 3방향 동기화를 CI에서 강제한다. 실패 출력은 에이전트가 따라할 다음 행동 지시문이다.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  harness-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Docs ↔ contract sync
        run: pnpm harness:docs

      - name: Boundary scans
        run: pnpm harness:boundaries

      - name: Skill mirrors
        run: pnpm harness:mirrors

      - name: Lint (boundary rules)
        run: pnpm lint

      - name: Contract self-test
        run: pnpm turbo run test --filter=@ssota/contracts

  pr-forensics:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: PR claim forensics
        run: node scripts/harness/pr-forensics.mjs
