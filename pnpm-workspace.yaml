packages:
  - "docs"
  - "apps/*"
  - "packages/*"
  - "e2e"
overrides:
  "@types/react": "19.2.17"
  "@types/react-dom": "19.2.3"
allowBuilds:
  '@sentry/cli': true
  '@swc/core': true
  bufferutil: false
  cbor-extract: true
  esbuild: true
  sharp: true
  unrs-resolver: true
  utf-8-validate: false
  zlib-sync: false
minimumReleaseAgeExclude:
  - '@supabase/auth-js@2.108.1'
  - '@supabase/functions-js@2.108.1'
  - '@supabase/postgrest-js@2.108.1'
  - '@supabase/realtime-js@2.108.1'
  - '@supabase/storage-js@2.108.1'
  - '@supabase/supabase-js@2.108.1'
  - '@vercel/oidc@3.6.2'
  - emulate@0.8.0
  - '@ai-sdk/gateway@4.0.2'
  - '@ai-sdk/react@4.0.2'
  - '@ai-sdk/workflow@1.0.2'
  - ai@7.0.2
  - '@composio/vercel@0.11.0'
packageExtensions:
  # streamdown@2.5.0은 d.ts에서 `from "shiki"`를 쓰면서 shiki를 선언하지 않는다
  # (phantom dep) — pnpm 숨은 hoist가 잡는 버전에 따라 타입이 갈려, fumadocs가
  # shiki 4를 들여온 뒤 Vercel에서 4.4.3이 hoist되며 web build가 깨졌다.
  # @streamdown/code와 같은 ^3.19.0을 명시해 항상 shiki 3을 nested resolve한다.
  streamdown:
    dependencies:
      shiki: "^3.19.0"
